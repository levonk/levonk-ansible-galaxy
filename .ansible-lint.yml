---
# .ansible-lint.yml

# Based on recommended settings + adaptations for Ansible roles/playbooks

# Configure verbosity (0, 1, 2)
verbosity: 1

# Enable specific rules
enable_list:
  # Core rules
  - braces
  - commands-instead-of-arguments
  - deprecated-command-usage
  - deprecated-module
  - no-relative-paths
  - package-latest
  - risky-file-permissions
  - parser-error
  - syntax
  - conditional-indentation
  - name[missing]
  - no-loop-var
  - private-ok
  - no-tabs

# Skip specific rules
skip_list:
  - fqcn-builtins  # Disable FQCN requirement for builtin modules
  - fqcn-import    # Disable FQCN requirement for imports
  - name[casing]   # Disable name casing requirements
  - no-changed-when  # Too many false positives
  - no-handler     # Too restrictive for some use cases
  - command-shell  # False positives
  - conditional-complexity  # Too restrictive
  - role-name      # Disable role name validation
  - rule-unnecessary-task  # Too restrictive
  - arguments-order  # Too pedantic
  - jinja-variable-name  # Too restrictive
  - line-length    # Already handled by yamllint
  - unnamed-task   # Too restrictive

# Paths to exclude
exclude_paths:
  - .git
  - .venv
  - .tox
  - docs
  - tests
  - library  # if using custom modules
  - vars/    # Exclude vars directory

# Tags to skip (these are rule tags, not Ansible tags)
tags:
  - skip_ansible_lint  # Can be used to skip files with this tag

# Custom rule directories (if you have them)
# rulesdir:
#   - /path/to/custom/rules

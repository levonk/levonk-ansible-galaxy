---
# Kickstart Test Playlist for levonk Namespace (FULL COVERAGE)
# This playbook includes every role in every collection in the levonk namespace and enables every feature/task for maximal test coverage.
# Generated per /ansible-test-playlist30-namespace workflow.

- name: Test all levonk roles (all features enabled)
  hosts: all
  gather_facts: false
  become: false
  roles:
    # --- base_system Collection ---
    - role: levonk.base_system.base_system
    - role: levonk.base_system.reboot_manager
    - role: levonk.base_system.syscheck
    - role: levonk.base_system.user_setup

    # --- common Collection ---
    - role: levonk.common.checksums
    - role: levonk.common.fonts
    - role: levonk.common.install_gui_conditionally
    - role: levonk.common.open_firewall_port
    - role: levonk.common.package
    - role: levonk.common.vet_script_installer

    # --- gamer Collection ---
    - role: levonk.gamer.bluestacks_setup
    - role: levonk.gamer.epic_setup
    - role: levonk.gamer.game_performance_tuning
    - role: levonk.gamer.minecraft_forge_setup
    - role: levonk.gamer.origin_setup
    - role: levonk.gamer.steam_setup
    - role: levonk.gamer.xbox_setup

    # --- hardened Collection ---
    - role: levonk.hardened.bitwarden-cli-support
    - role: levonk.hardened.harden_baseline
    - role: levonk.hardened.harden_custom
    - role: levonk.hardened.harden_moderate
    - role: levonk.hardened.harden_noop
    - role: levonk.hardened.harden_paranoid

    # --- user_setup Collection ---
    - role: levonk.user_setup.chezmoi
    - role: levonk.user_setup.local_user
    - role: levonk.user_setup.remote_user
    - role: levonk.user_setup.service_user
    - role: levonk.user_setup.thick-shell

    # --- vibeops Collection ---
    - role: levonk.vibeops.browsers
    - role: levonk.vibeops.comms
      vars:
        comms_install_discord: true
        comms_install_telegram: true
        comms_install_signal: true
    - role: levonk.vibeops.dev-ai-assisted
    - role: levonk.vibeops.dev-ansible
    - role: levonk.vibeops.dev-cloud
    - role: levonk.vibeops.dev-cpp
    - role: levonk.vibeops.dev-docker
    - role: levonk.vibeops.dev-dotnet
    - role: levonk.vibeops.dev-go
    - role: levonk.vibeops.dev-java
    - role: levonk.vibeops.dev-js
      vars:
        dev_js_install_nodejs: true
        dev_js_install_fnm: true
        dev_js_install_pnpm: true
        dev_js_install_yarn: true
        dev_js_install_typescript: true
        dev_js_install_eslint: true
        dev_js_install_prettier: true
        dev_js_install_vite: true
        dev_js_install_create_react_app: true
    - role: levonk.vibeops.dev-node
    - role: levonk.vibeops.dev-php
    - role: levonk.vibeops.dev-python
      vars:
        python_versions: ["3.11.0", "3.9.0"]
        install_pyenv: true
        install_virtualenv: true
        install_virtualenvwrapper: true
        install_miniconda: true
        install_poetry: true
        install_pipenv: true
        install_pdm: true
        install_uv: true
        dev_python_tools: ["black", "flake8", "pytest"]
    - role: levonk.vibeops.dev-ruby
    - role: levonk.vibeops.dev-rust
    - role: levonk.vibeops.developer
    - role: levonk.vibeops.devops
      vars:
        devops_virtualization_enabled: true
        devops_install_gitkeeper: true
    - role: levonk.vibeops.knowledge
    - role: levonk.vibeops.multimedia
    - role: levonk.vibeops.quantified-self
    - role: levonk.vibeops.syscheck
    - role: levonk.vibeops.tools
      vars:
        tools_install_sublime_text: true
        tools_install_espanso: true
        tools_install_speech_tools: true
        tools_install_alttab: true
    - role: levonk.vibeops.wsl_setup
      vars:
        wsl_distribution: Ubuntu

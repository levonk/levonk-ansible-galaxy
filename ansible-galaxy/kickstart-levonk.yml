---
# Kickstart Test Playlist for levonk Namespace (FULL COVERAGE)

- name: Test all levonk roles (all features enabled)
  hosts: all
  gather_facts: false
  become: false
  tasks:

    # --- base_system Collection ---
    - name: Include base_system.base_system
      ansible.builtin.include_role:
        name: levonk.base_system.base_system

    - name: Include base_system.reboot_manager
      ansible.builtin.include_role:
        name: levonk.base_system.reboot_manager

    - name: Include base_system.syscheck
      ansible.builtin.include_role:
        name: levonk.base_system.syscheck

    - name: Include base_system.user_setup
      ansible.builtin.include_role:
        name: levonk.base_system.user_setup

    # --- common Collection ---
    - name: Include common.checksums
      ansible.builtin.include_role:
        name: levonk.common.checksums

    - name: Include common.fonts
      ansible.builtin.include_role:
        name: levonk.common.fonts

    - name: Include common.install_gui_conditionally
      ansible.builtin.include_role:
        name: levonk.common.install_gui_conditionally

    - name: Include common.open_firewall_port
      ansible.builtin.include_role:
        name: levonk.common.open_firewall_port

    - name: Include common.package
      ansible.builtin.include_role:
        name: levonk.common.package

    - name: Include common.vet_script_installer
      ansible.builtin.include_role:
        name: levonk.common.vet_script_installer

    # --- gamer Collection ---
    - name: Include gamer.bluestacks_setup
      ansible.builtin.include_role:
        name: levonk.gamer.bluestacks_setup

    - name: Include gamer.epic_setup
      ansible.builtin.include_role:
        name: levonk.gamer.epic_setup

    - name: Include gamer.game_performance_tuning
      ansible.builtin.include_role:
        name: levonk.gamer.game_performance_tuning

    - name: Include gamer.minecraft_forge_setup
      ansible.builtin.include_role:
        name: levonk.gamer.minecraft_forge_setup

    - name: Include gamer.origin_setup
      ansible.builtin.include_role:
        name: levonk.gamer.origin_setup

    - name: Include gamer.steam_setup
      ansible.builtin.include_role:
        name: levonk.gamer.steam_setup

    - name: Include gamer.xbox_setup
      ansible.builtin.include_role:
        name: levonk.gamer.xbox_setup

    # --- hardened Collection ---
    - name: Include hardened.bitwarden-cli-support
      ansible.builtin.include_role:
        name: levonk.hardened.bitwarden-cli-support

    - name: Include hardened.harden_baseline
      ansible.builtin.include_role:
        name: levonk.hardened.harden_baseline

    - name: Include hardened.harden_custom
      ansible.builtin.include_role:
        name: levonk.hardened.harden_custom

    - name: Include hardened.harden_moderate
      ansible.builtin.include_role:
        name: levonk.hardened.harden_moderate

    - name: Include hardened.harden_noop
      ansible.builtin.include_role:
        name: levonk.hardened.harden_noop

    - name: Include hardened.harden_paranoid
      ansible.builtin.include_role:
        name: levonk.hardened.harden_paranoid

    # --- user_setup Collection ---
    - name: Include user_setup.chezmoi
      ansible.builtin.include_role:
        name: levonk.user_setup.chezmoi

    - name: Include user_setup.local_user
      ansible.builtin.include_role:
        name: levonk.user_setup.local_user

    - name: Include user_setup.remote_user
      ansible.builtin.include_role:
        name: levonk.user_setup.remote_user

    - name: Include user_setup.service_user
      ansible.builtin.include_role:
        name: levonk.user_setup.service_user

    - name: Include user_setup.thick-shell
      ansible.builtin.include_role:
        name: levonk.user_setup.thick-shell

    # --- vibeops Collection ---
    - name: Include vibeops.browsers
      ansible.builtin.include_role:
        name: levonk.vibeops.browsers

    - name: Include vibeops.comms
      ansible.builtin.include_role:
        name: levonk.vibeops.comms
      vars:
        comms_install_discord: true
        comms_install_telegram: true
        comms_install_signal: true

    - name: Include vibeops.dev-ai-assisted
      ansible.builtin.include_role:
        name: levonk.vibeops.dev-ai-assisted

    - name: Include vibeops.dev-ansible
      ansible.builtin.include_role:
        name: levonk.vibeops.dev-ansible

    - name: Include vibeops.dev-cloud
      ansible.builtin.include_role:
        name: levonk.vibeops.dev-cloud

    - name: Include vibeops.dev-cpp
      ansible.builtin.include_role:
        name: levonk.vibeops.dev-cpp

    - name: Include vibeops.dev-docker
      ansible.builtin.include_role:
        name: levonk.vibeops.dev-docker

    - name: Include vibeops.dev-dotnet
      ansible.builtin.include_role:
        name: levonk.vibeops.dev-dotnet

    - name: Include vibeops.dev-go
      ansible.builtin.include_role:
        name: levonk.vibeops.dev-go

    - name: Include vibeops.dev-java
      ansible.builtin.include_role:
        name: levonk.vibeops.dev-java

    - name: Include vibeops.dev-js
      ansible.builtin.include_role:
        name: levonk.vibeops.dev-js
      vars:
        dev_js_install_nodejs: true
        dev_js_install_fnm: true
        dev_js_install_pnpm: true
        dev_js_install_yarn: true
        dev_js_install_typescript: true
        dev_js_install_eslint: true
        dev_js_install_prettier: true
        dev_js_install_vite: true
        dev_js_install_create_react_app: true

    - name: Include vibeops.dev-node
      ansible.builtin.include_role:
        name: levonk.vibeops.dev-node

    - name: Include vibeops.dev-php
      ansible.builtin.include_role:
        name: levonk.vibeops.dev-php

    - name: Include vibeops.dev-python
      ansible.builtin.include_role:
        name: levonk.vibeops.dev-python
      vars:
        python_versions: ["3.11.0", "3.9.0"]
        install_pyenv: true
        install_virtualenv: true
        install_virtualenvwrapper: true
        install_miniconda: true
        install_poetry: true
        install_pipenv: true
        install_pdm: true
        install_uv: true
        dev_python_tools: ["black", "flake8", "pytest"]

    - name: Include vibeops.dev-ruby
      ansible.builtin.include_role:
        name: levonk.vibeops.dev-ruby

    - name: Include vibeops.dev-rust
      ansible.builtin.include_role:
        name: levonk.vibeops.dev-rust

    - name: Include vibeops.developer
      ansible.builtin.include_role:
        name: levonk.vibeops.developer

    - name: Include vibeops.devops
      ansible.builtin.include_role:
        name: levonk.vibeops.devops
      vars:
        devops_virtualization_enabled: true
        devops_install_gitkeeper: true

    - name: Include vibeops.knowledge
      ansible.builtin.include_role:
        name: levonk.vibeops.knowledge

    - name: Include vibeops.multimedia
      ansible.builtin.include_role:
        name: levonk.vibeops.multimedia

    - name: Include vibeops.quantified-self
      ansible.builtin.include_role:
        name: levonk.vibeops.quantified-self

    - name: Include vibeops.syscheck
      ansible.builtin.include_role:
        name: levonk.vibeops.syscheck

    - name: Include vibeops.tools
      ansible.builtin.include_role:
        name: levonk.vibeops.tools
      vars:
        tools_install_sublime_text: true
        tools_install_espanso: true
        tools_install_speech_tools: true
        tools_install_alttab: true

    - name: Include vibeops.wsl_setup
      ansible.builtin.include_role:
        name: levonk.vibeops.wsl_setup
      vars:
        wsl_distribution: Ubuntu
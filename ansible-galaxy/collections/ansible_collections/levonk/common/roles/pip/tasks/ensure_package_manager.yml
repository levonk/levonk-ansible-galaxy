---
# Ensure the detected package manager is installed

- name: "Check if Python is installed"
  ansible.builtin.command: which python3
  register: python_check
  changed_when: false
  failed_when: false

- name: "Install Python if not present"
  ansible.builtin.package:
    name: python3
    state: present
  become: true
  when: python_check.rc != 0

- name: "Check if pip is installed"
  ansible.builtin.command: which pip3
  register: pip_check
  changed_when: false
  failed_when: false

- name: "Install pip if not present"
  ansible.builtin.package:
    name: python3-pip
    state: present
  become: true
  when: pip_check.rc != 0

- name: "Check if uv is installed"
  ansible.builtin.command: which uv
  register: uv_check
  changed_when: false
  failed_when: false

- name: "Install uv if needed"
  ansible.builtin.command: "pip3 install uv"
  become: "{{ pip_become | default(false) }}"
  when: python_package_manager == 'uv' and uv_check.rc != 0

- name: "Check if poetry is installed"
  ansible.builtin.command: which poetry
  register: poetry_check
  changed_when: false
  failed_when: false

- name: "Install poetry if needed"
  ansible.builtin.command: "pip3 install poetry"
  become: "{{ pip_become | default(false) }}"
  when: python_package_manager == 'poetry' and poetry_check.rc != 0

- name: "Check if pipenv is installed"
  ansible.builtin.command: which pipenv
  register: pipenv_check
  changed_when: false
  failed_when: false

- name: "Install pipenv if needed"
  ansible.builtin.command: "pip3 install pipenv"
  become: "{{ pip_become | default(false) }}"
  when: python_package_manager == 'pipenv' and pipenv_check.rc != 0

- name: "Check if pdm is installed"
  ansible.builtin.command: which pdm
  register: pdm_check
  changed_when: false
  failed_when: false

- name: "Install pdm if needed"
  ansible.builtin.command: "pip3 install pdm"
  become: "{{ pip_become | default(false) }}"
  when: python_package_manager == 'pdm' and pdm_check.rc != 0

- name: "Check if conda is installed"
  ansible.builtin.command: which conda
  register: conda_check
  changed_when: false
  failed_when: false

- name: "Warn if conda is needed but not installed"
  ansible.builtin.debug:
    msg: "WARNING: Conda is required but not installed. Please install Miniconda or Anaconda manually."
  when: python_package_manager == 'conda' and conda_check.rc != 0

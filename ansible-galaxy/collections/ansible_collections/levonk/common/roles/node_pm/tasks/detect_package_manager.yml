---
# Detect which Node.js package manager to use based on project files

- name: "Set default package manager to pnpm"
  ansible.builtin.set_fact:
    node_package_manager: "pnpm"
    node_package_manager_install_cmd: "pnpm add"
    node_package_manager_global_flag: "-g"

- name: "Check for yarn.lock file"
  ansible.builtin.stat:
    path: "{{ project_dir | default(ansible_env.PWD) }}/yarn.lock"
  register: yarn_lock

- name: "Check for pnpm-lock.yaml file"
  ansible.builtin.stat:
    path: "{{ project_dir | default(ansible_env.PWD) }}/pnpm-lock.yaml"
  register: pnpm_lock

- name: "Check for package-lock.json file"
  ansible.builtin.stat:
    path: "{{ project_dir | default(ansible_env.PWD) }}/package-lock.json"
  register: npm_lock

- name: "Check for bun.lockb file"
  ansible.builtin.stat:
    path: "{{ project_dir | default(ansible_env.PWD) }}/bun.lockb"
  register: bun_lock

- name: "Check for package.json file"
  ansible.builtin.stat:
    path: "{{ project_dir | default(ansible_env.PWD) }}/package.json"
  register: package_json

- name: "Read package.json if it exists"
  ansible.builtin.slurp:
    src: "{{ project_dir | default(ansible_env.PWD) }}/package.json"
  register: package_json_content
  when: package_json.stat.exists

- name: "Parse package.json content"
  ansible.builtin.set_fact:
    package_json_data: "{{ package_json_content['content'] | b64decode | from_json }}"
  when: package_json.stat.exists and package_json_content is defined

- name: "Check for packageManager field in package.json"
  ansible.builtin.set_fact:
    package_manager_from_json: "{{ package_json_data.packageManager.split('@')[0] if package_json_data.packageManager is defined else '' }}"
  when: package_json.stat.exists and package_json_data is defined

- name: "Set package manager based on detection"
  ansible.builtin.set_fact:
    node_package_manager: "{{ 'yarn' if yarn_lock.stat.exists else 
                             'pnpm' if pnpm_lock.stat.exists else 
                             'npm' if npm_lock.stat.exists else 
                             'bun' if bun_lock.stat.exists else 
                             package_manager_from_json if package_manager_from_json != '' else 
                             'pnpm' }}"

- name: "Set package manager install command"
  ansible.builtin.set_fact:
    node_package_manager_install_cmd: "{{ 'yarn add' if node_package_manager == 'yarn' else 
                                          'pnpm add' if node_package_manager == 'pnpm' else 
                                          'npm install' if node_package_manager == 'npm' else 
                                          'bun add' if node_package_manager == 'bun' else 
                                          'pnpm add' }}"

- name: "Set package manager global flag"
  ansible.builtin.set_fact:
    node_package_manager_global_flag: "{{ 'global' if node_package_manager == 'yarn' else 
                                          '-g' }}"

- name: "Display detected package manager"
  ansible.builtin.debug:
    msg: "Detected Node.js package manager: {{ node_package_manager }}"

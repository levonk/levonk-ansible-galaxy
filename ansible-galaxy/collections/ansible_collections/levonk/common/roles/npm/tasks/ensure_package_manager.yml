---
# Ensure the detected package manager is installed

- name: "Check if Node.js is installed"
  ansible.builtin.command: which node
  register: node_check
  changed_when: false
  failed_when: false

- name: "Install Node.js if not present"
  ansible.builtin.package:
    name: nodejs
    state: present
  become: true
  when: node_check.rc != 0

- name: "Check if npm is installed"
  ansible.builtin.command: which npm
  register: npm_check
  changed_when: false
  failed_when: false

- name: "Install npm if not present"
  ansible.builtin.package:
    name: npm
    state: present
  become: true
  when: npm_check.rc != 0

- name: "Check if detected package manager is installed"
  ansible.builtin.command: "which {{ node_package_manager }}"
  register: pkg_mgr_check
  changed_when: false
  failed_when: false

- name: "Install pnpm if needed"
  ansible.builtin.command: "npm install -g pnpm"
  become: true
  when: node_package_manager == 'pnpm' and pkg_mgr_check.rc != 0

- name: "Install yarn if needed"
  ansible.builtin.command: "npm install -g yarn"
  become: true
  when: node_package_manager == 'yarn' and pkg_mgr_check.rc != 0

- name: "Install bun if needed"
  ansible.builtin.command: "npm install -g bun"
  become: true
  when: node_package_manager == 'bun' and pkg_mgr_check.rc != 0

---
# Harden Baseline: Etckeeper tasks

- name: Etckeeper | Ensure etckeeper is installed
  levonk.common.package:
    name:
      - git
      - etckeeper
      - gnupg
    state: latest
  become: yes
  tags:
    - harden_baseline
    - etckeeper
    - security

- name: Etckeeper | Check if any GPG secret key exists (Linux)
  ansible.builtin.shell: |
    gpg --list-secret-keys --with-colons | grep '^sec:' || true
  register: gpg_key_exists
  changed_when: false
  become: yes
  tags:
    - harden_baseline
    - etckeeper
    - gpg

- name: Etckeeper | Generate GPG key for automation (Linux)
  ansible.builtin.shell: |
    echo -e "Key-Type: default\nSubkey-Type: default\nName-Real: VibeOps Automation\nName-Email: automation@localhost\nExpire-Date: 0\n%no-protection\n%commit" | gpg --batch --gen-key
  when: force_generate_gpg_key | default(false) or gpg_key_exists.stdout == ''
  become: yes
  tags:
    - harden_baseline
    - etckeeper
    - gpg

- name: Etckeeper | Configure etckeeper to use git
  ansible.builtin.lineinfile:
    path: /etc/etckeeper/etckeeper.conf
    regexp: '^#?VCS='
    line: 'VCS="git"'
    state: present
    backup: yes
  become: yes
  tags:
    - harden_baseline
    - etckeeper
    - security

- name: Etckeeper | Configure etckeeper to automatically react to package installs
  ansible.builtin.lineinfile:
    path: /etc/etckeeper/etckeeper.conf
    regexp: '^#?HIGHLEVEL_COMMIT='
    line: 'HIGHLEVEL_COMMIT=yes'
    state: present
    backup: yes
  become: yes
  tags:
    - harden_baseline
    - etckeeper
    - security

- name: Etckeeper | Dont risk partial commits by rebooting during reboot
  ansible.builtin.lineinfile:
    path: /etc/etckeeper/etckeeper.conf
    regexp: '^#?AVOID_COMMIT_BEFORE_REBOOT='
    line: 'AVOID_COMMIT_BEFORE_REBOOT=yes'
    state: present
    backup: yes
  become: yes
  tags:
    - harden_baseline
    - etckeeper
    - security

- name: Etckeeper | In case a commit was missed enable daily commit
  ansible.builtin.lineinfile:
    path: /etc/etckeeper/etckeeper.conf
    regexp: '^#?DAILY_AUTO_COMMIT='
    line: 'DAILY_AUTO_COMMIT=yes'
    state: present
    backup: yes
  become: yes
  tags:
    - harden_baseline
    - etckeeper
    - security

- name: Etckeeper | If a file wasn't added, add it
  ansible.builtin.lineinfile:
    path: /etc/etckeeper/etckeeper.conf
    regexp: '^#?ALLOW_UNTRACKED='
    line: 'ALLOW_UNTRACKED=yes'
    state: present
    backup: yes
  become: yes
  tags:
    - harden_baseline
    - etckeeper
    - security

- name: Etckeeper | Create initial repository
  ansible.builtin.lineinfile:
    path: /etc/etckeeper/etckeeper.conf
    regexp: '^#?ALLOW_UNTRACKED='
    line: 'ALLOW_UNTRACKED=yes'
    state: present
    backup: yes
  become: yes
  tags:
    - harden_baseline
    - etckeeper
    - security

- name: Etckeeper | Initialize etckeeper repository
  ansible.builtin.command:
    cmd: etckeeper init
    creates: /etc/.git
  become: yes
  tags:
    - harden_baseline
    - etckeeper
    - security

---
# Extra moderate Linux controls (not baseline)

- name: Restrict at to root only
  ansible.builtin.copy:
    dest: /etc/at.allow
    content: "root\n"
    owner: root
    group: root
    mode: '0600'

- name: Enable automatic security updates (Debian/Ubuntu)
  include_role:
    name: levonk.common.package
  vars:
    package_name: unattended-upgrades
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Enable automatic security updates (RedHat/Fedora)
  include_role:
    name: levonk.common.package
  vars:
    package_name: dnf-automatic
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

---
# handlers file for lite-llm
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
    name: litellm
  become: true
  tags:
    - lite-llm
    - service

- name: restart litellm
  ansible.builtin.systemd:
    name: litellm
    state: restarted
    daemon_reload: true
  become: true
  tags:
    - lite-llm
    - service

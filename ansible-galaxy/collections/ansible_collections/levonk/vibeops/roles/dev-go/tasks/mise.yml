---
# Use Mise to install Go runtime

- name: Ensure Mise is installed
  ansible.builtin.include_role:
    name: levonk.common.mise

# Non-Windows: Linux/macOS
- name: Install Go via Mise (non-Windows)
  ansible.builtin.shell: |
    set -euo pipefail
    mise use -g go@{{ dev_go_version }}
  args:
    executable: /bin/bash
  when: ansible_facts['os_family'] in ['Debian', 'RedHat', 'Ubuntu', 'MacOSX']

# Windows
- name: Install Go via Mise (Windows)
  ansible.builtin.command: mise use -g go@{{ dev_go_version }}
  when: ansible_facts['os_family'] == 'Windows'

---
- name: Install fnm (Fast Node Manager) on Linux/macOS
  ansible.builtin.shell: |
    curl -fsSL https://fnm.vercel.app/install | bash
  args:
    creates: ~/.fnm/fnm
  when:
    - dev_js_install_fnm | default(true)
    - ansible_facts['os_family'] in ['Debian', 'RedHat', 'Ubuntu', 'MacOSX']

- name: Install fnm (Fast Node Manager) on Windows (Scoop)
  ansible.builtin.command: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass -Command
    "scoop install fnm"
  when:
    - dev_js_install_fnm | default(true)
    - ansible_facts['os_family'] == 'Windows'
    - lookup('ansible.builtin.env', 'SCOOP') != ''

- name: Install fnm (Fast Node Manager) on Windows (Chocolatey fallback)
  include_role:
    name: levonk.common.package
  vars:
    packages:
      - name: fnm
        state: latest
  when:
    - dev_js_install_fnm | default(true)
    - ansible_facts['os_family'] == 'Windows'
    - lookup('ansible.builtin.env', 'SCOOP') == ''

- name: Install Volta.sh on Linux/macOS
  ansible.builtin.shell: |
    curl https://get.volta.sh | bash
  args:
    creates: "~/.volta/bin/volta"
  when:
    - dev_js_install_volta | default(true)
    - ansible_facts['os_family'] in ['Debian', 'RedHat', 'Ubuntu', 'MacOSX']

- name: Install Volta.sh on Windows (PowerShell)
  ansible.builtin.command: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass -Command
    "Set-ExecutionPolicy Bypass -Scope Process -Force; `
    [System.Net.ServicePointManager]::SecurityProtocol = `
    [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; `
    iex ((New-Object System.Net.WebClient).DownloadString('https://get.volta.sh'))"
  when:
    - dev_js_install_volta | default(true)
    - ansible_facts['os_family'] == 'Windows'

- name: Install pnpm globally
  include_role:
    name: levonk.common.node-pm
    tasks_from: install_global_packages
  vars:
    npm_packages:
      - pnpm
  when:
    - dev_js_install_pnpm | default(true)
    - ansible_facts['os_family'] != 'Windows'

- name: Install pnpm globally (Windows)
  include_role:
    name: levonk.common.node-pm
    tasks_from: install_global_packages
  vars:
    npm_packages:
      - pnpm
  when:
    - dev_js_install_pnpm | default(true)
    - ansible_facts['os_family'] == 'Windows'

# Bun package manager
- name: Install Bun (all platforms)
  include_tasks: package-managers/bun.yml
  when:
    - dev_js_install_bun | default(true)

- name: Enable corepack for yarn/pnpm (Node >=16.10)
  ansible.builtin.shell: corepack enable yarn
  when:
    - dev_js_install_yarn | default(true)
    - ansible_facts['os_family'] != 'Windows'

- name: Install yarn globally (fallback)
  include_role:
    name: levonk.common.node-pm
    tasks_from: install_global_packages
  vars:
    npm_packages:
      - yarn
  when:
    - dev_js_install_yarn | default(true)
    - ansible_facts['os_family'] != 'Windows'

- name: Install yarn globally (Windows)
  include_role:
    name: levonk.common.node-pm
    tasks_from: install_global_packages
  vars:
    npm_packages:
      - yarn
  when:
    - dev_js_install_yarn | default(true)
    - ansible_facts['os_family'] == 'Windows'

---
- name: Include Mise-based JS runtime setup
  ansible.builtin.import_tasks: mise.yml
  when: dev_js_use_mise | default(true)

- name: Include Node.js and npm installation (legacy)
  ansible.builtin.import_tasks: nodejs.yml
  when: not (dev_js_use_mise | default(true))

- name: Include JavaScript managers (legacy: fnm, pnpm, yarn)
  ansible.builtin.import_tasks: js-managers.yml
  when: not (dev_js_use_mise | default(true))

- name: Include JavaScript linters (eslint)
  ansible.builtin.import_tasks: js-linters.yml

- name: Include JavaScript formatters (prettier)
  ansible.builtin.import_tasks: js-formatters.yml

- name: Include JavaScript build tools (vite, CRA, typescript)
  ansible.builtin.import_tasks: js-build-tools.yml

- name: Include WebStorm IDE installation
  ansible.builtin.import_tasks: webstorm.yml
  when:
    - dev_js_install_webstorm | bool
    - '"graphical" in ansible_run_tags'

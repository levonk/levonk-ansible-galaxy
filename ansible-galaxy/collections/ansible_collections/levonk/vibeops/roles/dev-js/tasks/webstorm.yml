---
# Install JetBrains WebStorm IDE
- name: Install WebStorm dependencies (Debian/Ubuntu)
  include_role:
    name: levonk.common.package
  vars:
    packages:
      - name: libxrender1
        state: present
      - name: libxtst6
        state: present
      - name: libxi6
        state: present
      - name: libfreetype6
        state: present
      - name: libfontconfig1
        state: present
      - name: libxext6
        state: present
      - name: libx11-6
        state: present
  when: ansible_os_family == 'Debian'
  tags:
    - webstorm
    - js
    - graphical

- name: Download WebStorm
  ansible.builtin.get_url:
    url: https://download.jetbrains.com/webstorm/WebStorm-{{ webstorm_version }}.tar.gz
    dest: /tmp/webstorm-{{ webstorm_version }}.tar.gz
    checksum: "sha256:{{ webstorm_checksum }}"
    mode: '0644'
  register: download_webstorm
  tags:
    - webstorm
    - js
    - graphical

- name: Create WebStorm installation directory
  ansible.builtin.file:
    path: /opt/webstorm
    state: directory
    mode: '0755'
  tags:
    - webstorm
    - js
    - graphical

- name: Extract WebStorm
  ansible.builtin.unarchive:
    src: /tmp/webstorm-{{ webstorm_version }}.tar.gz
    dest: /opt/
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: /opt/webstorm/bin/webstorm.sh
  register: extracted_webstorm
  tags:
    - webstorm
    - js
    - graphical

- name: Create symlink to WebStorm binary
  ansible.builtin.file:
    src: /opt/webstorm/bin/webstorm.sh
    dest: /usr/local/bin/webstorm
    state: link
    force: true
    mode: '0755'
  when: extracted_webstorm.changed
  tags:
    - webstorm
    - js
    - graphical

- name: Create desktop entry for WebStorm
  ansible.builtin.template:
    src: webstorm.desktop.j2
    dest: /usr/share/applications/webstorm.desktop
    mode: '0644'
  tags:
    - webstorm
    - js
    - graphical

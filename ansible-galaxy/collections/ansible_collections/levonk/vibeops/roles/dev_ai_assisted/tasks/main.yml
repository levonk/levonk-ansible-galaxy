---
# tasks file for dev_ai_assisted
# Main entry point for AI-assisted development tools installation

# IDE Components
- name: "Install GUI IDEs"
  block:
    - name: "Install Visual Studio Code"
      include_tasks: ide/gui/install_vscode.yml

    - name: "Install Cursor"
      include_tasks: ide/terminal/install_cursor.yml

    - name: "Install Kiro"
      include_tasks: ide/gui/install_kiro.yml

    - name: "Install Windsurf"
      include_tasks: ide/gui/install_windsurf.yml

# Terminal Tools
- name: "Install Terminal Tools"
  block:
    - name: "Install Warp"
      include_tasks: install_warp.yml

    - name: "Install GitHub Copilot CLI"
      include_tasks: ide/terminal/copilot-cli.yml

    - name: "Install Gemini CLI"
      include_tasks: ide/terminal/install_gemini_cli.yml

    - name: "Install OpenCode"
      include_tasks: ide/terminal/install_opencode.yml

    - name: "Crush Setup"
      include_tasks: ide/terminal/crush.yml

    - name: "Install Cline (Fig)"
      include_tasks: ide/terminal/install_cline.yml

# Cloud CLIs
- name: "Install Cloud CLIs"
  block:
    - name: "Install Google Cloud SDK"
      include_tasks: install_gcloud_sdk.yml

    - name: "Install AWS CLI"
      include_tasks: install_aws_cli.yml

    - name: "Install Amazon Q"
      include_tasks: install_amazon_q.yml

# Claude Code Ecosystem
- name: "Install Claude Code Tools"
  block:
    - name: "Install Claude Code (npm package)"
      include_tasks: ide/terminal/claude-code/install-claude-code.yml

    - name: "Install Claude Code Router"
      include_tasks: ide/terminal/claude-code/install-claude-router.yml

    - name: "Install Claude Code Proxy"
      include_tasks: ide/terminal/claude-code/install_proxy.yml

    - name: "Install CodeMCP (Claude Code Multi-Prompt)"
      include_tasks: ide/terminal/claude-code/install_codemcp.yml

    - name: "Install SuperClaude Framework"
      include_tasks: ide/terminal/claude-code/install_superclaude.yml

    - name: "Install Awesome Claude Prompts"
      include_tasks: ide/terminal/claude-code/install_awesome_claude_prompts.yml

    - name: "Install Awesome AI System Prompts"
      include_tasks: ide/terminal/claude-code/install_awesome_ai_system_prompts.yml

    - name: "Install Awesome Claude Code Resources"
      include_tasks: ide/terminal/claude-code/install_awesome_claude_code.yml

    - name: "Install Claude Suite"
      include_tasks: ide/terminal/claude-code/install_claude_suite.yml

# AI/ML Tools
- name: "Install AI/ML Tools"
  block:
    - name: "Install Archon - AI-assisted development tool"
      include_tasks: mcp/install_archon.yml
      tags: ['archon', 'ai', 'dev-tools']

    - name: "Install Serena - AI coding agent toolkit"
      include_tasks: mcp/install_serena.yml
      tags: ['serena', 'ai', 'mcp', 'dev-tools']

    - name: "Install MCP-Zero - Active Tool Discovery for Autonomous LLM Agents"
      include_tasks: mcp/install_mcp_zero.yml
      tags: ['mcp-zero', 'ai', 'mcp', 'dev-tools']

# System Tools
- name: "Install System Tools"
  block:
    - name: "Install Tmux-Orchestrator"
      include_tasks: tmux/install_orchestrator.yml

    - name: "Install Agent (appdotbuild)"
      include_tasks: agent/install_agent.yml

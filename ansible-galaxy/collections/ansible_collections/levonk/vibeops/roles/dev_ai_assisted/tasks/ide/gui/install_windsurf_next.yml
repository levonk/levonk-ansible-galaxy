---
- name: "Install Windsurf Next (macOS)"
  community.general.homebrew_cask:
    name: windsurf-next
    state: present
  when: ansible_facts['os_family'] == "Darwin"
  tags: ['windsurf-next', 'ide', 'graphical']

- name: "Install Windsurf Next (Windows)"
  ansible.windows.win_winget:
    name: Windsurf.WindsurfNext
    state: present
  when: ansible_facts['os_family'] == "Windows"
  tags: ['windsurf-next', 'ide', 'graphical']

- name: "Install Windsurf Next (Linux)"
  ansible.builtin.debug:
    msg:
      - "Automated installation for Windsurf Next on Linux is not yet available."
      - "Please download it manually from: https://windsurf.com/download/editor?next=true"
  when: ansible_facts['os_family'] == "Debian"
  tags: ['windsurf-next', 'ide', 'graphical']

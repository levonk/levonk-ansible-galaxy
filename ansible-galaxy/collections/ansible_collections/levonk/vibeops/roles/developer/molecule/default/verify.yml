---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    # Verifications for Windows
    - name: Check for Long Filename Support setting
      when: ansible_os_family == 'Windows'
      ansible.builtin.command:
        cmd: reg query "HKLM\\SYSTEM\\CurrentControlSet\\Control\\FileSystem" /v LongPathsEnabled
      register: long_path_cmd
      changed_when: false
      failed_when: long_path_cmd.rc != 0

    - name: Assert Long Filename Support is enabled
      when: ansible_os_family == 'Windows'
      ansible.builtin.assert:
        that:
          - long_path_cmd.stdout is search("LongPathsEnabled\s+REG_DWORD\s+0x1")

    - name: Check for Sticky Keys setting
      when: ansible_os_family == 'Windows'
      ansible.builtin.command:
        cmd: reg query "HKCU\\Control Panel\\Accessibility\\StickyKeys" /v Flags
      register: sticky_keys_cmd
      changed_when: false
      failed_when: sticky_keys_cmd.rc != 0

    - name: Assert Sticky Keys is disabled
      when: ansible_os_family == 'Windows'
      ansible.builtin.assert:
        that:
          - sticky_keys_cmd.stdout is search("Flags\s+REG_SZ\s+506")

    # Verifications for all platforms
    - name: Check if universal-ctags is installed
      ansible.builtin.command:
        cmd: ctags --version
      register: ctags_check
      changed_when: false
      failed_when: ctags_check.rc != 0

    - name: Check if super-linter is installed
      ansible.builtin.command:
        cmd: npx super-linter --version
      register: linter_check
      changed_when: false
      failed_when: linter_check.rc != 0

    - name: Check if mise is installed
      ansible.builtin.command:
        cmd: mise --version
      register: mise_check
      changed_when: false
      failed_when: mise_check.rc != 0

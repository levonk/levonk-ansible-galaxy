---
# Backward-compatibility wrapper for Mise install
# Delegates to the new levonk.common.mise role

- name: Include levonk.common.mise role (compat)
  ansible.builtin.include_role:
    name: levonk.common.mise
  vars:
    common_mise_install: {{ developer_install_mise | default(true) }}
  tags:
    - developer
    - tools
    - mise

---
# defaults file for levonk.vibeops.tools

graphical: false

# Set to true to install the corresponding utility tool.
tools_install_7zip: false
tools_install_sublime_text: false
tools_install_espanso: false
tools_install_speech_tools: false

# macOS-specific tools (default: true for better macOS experience)
tools_install_alttab: true
tools_install_stats: true
tools_install_hidden: true
tools_install_itsycal: true
tools_install_timeout: true
tools_install_keepingyouawake: true
tools_install_keka: true

# Windows-specific tools (default: true for better Windows experience)
tools_install_powertoys: true
tools_install_windows_terminal: true
tools_install_everything: true
tools_install_autohotkey: true
tools_install_sysinternals: true
tools_install_sharex: true
tools_install_notepadplusplus: true

# System utilities toggles
tools_install_dos2unix: true

# m1f tool configuration
tools_install_m1f: false  # Set to true to install m1f tool
m1f_version: "latest"  # Can be set to a specific version like "v1.0.0" or "latest"

# claude-task-master configuration
tools_install_claude_task_master: true  # Set to false to skip installation
claude_task_master_version: "main"  # Can be set to a specific version/tag/branch

# free-cluely configuration
tools_install_free_cluely: true  # Set to false to skip installation
free_cluely_install_dir: "~/.local/share/free-cluely"  # Installation directory
free_cluely_gemini_api_key: ""  # Set your Gemini API key here or in group_vars/host_vars
free_cluely_build: true  # Set to false to skip the build step (useful for development)
free_cluely_port: 5180  # Port to run the development server on


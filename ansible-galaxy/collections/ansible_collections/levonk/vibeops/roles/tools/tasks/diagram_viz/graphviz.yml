---
# Install Graphviz for all supported OSes

- name: Install Graphviz via levonk.common.package (cross-platform)
  block:
    - name: Install Graphviz on non-Windows systems
      levonk.common.package:
        name:
          - graphviz
        state: latest
      when: ansible_os_family != 'Windows'
      tags:
        - diagram
        - graphviz
        - tools
        - vibeops

    - name: Install Graphviz on Windows
      win_chocolatey:
        name: graphviz
        state: present
      when: ansible_os_family == 'Windows'
      tags:
        - diagram
        - graphviz
        - tools
        - windows

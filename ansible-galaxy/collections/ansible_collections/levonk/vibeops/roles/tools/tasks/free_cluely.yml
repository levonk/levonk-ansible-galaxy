---
# Install free-cluely - An open-source version of Cluely

- name: Include Node.js and pnpm installation from dev-js
  ansible.builtin.import_role:
    name: levonk.vibeops.dev_js
  tags:
    - tools
    - free-cluely
    - nodejs

- name: Create free-cluely installation directory
  ansible.builtin.file:
    path: "{{ free_cluely_install_dir | default('~/.local/share/free-cluely') }}"
    state: directory
    mode: '0755'
  tags:
    - tools
    - free-cluely

- name: Clone free-cluely repository
  ansible.builtin.git:
    repo: https://github.com/Prat011/free-cluely.git
    dest: "{{ free_cluely_install_dir | default('~/.local/share/free-cluely') }}"
    version: main
    update: yes
  register: free_cluely_repo
  tags:
    - tools
    - free-cluely

- name: Detect package manager from lock files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ free_cluely_install_dir | default('~/.local/share/free-cluely') }}/pnpm-lock.yaml"
    - "{{ free_cluely_install_dir | default('~/.local/share/free-cluely') }}/yarn.lock"
    - "{{ free_cluely_install_dir | default('~/.local/share/free-cluely') }}/package-lock.json"
  register: package_manager_check
  tags:
    - tools
    - free-cluely

- name: Set package manager based on lock files
  ansible.builtin.set_fact:
    package_manager: >-
      {% if package_manager_check.results[0].stat.exists %}
        pnpm
      {% elif package_manager_check.results[1].stat.exists %}
        yarn
      {% elif package_manager_check.results[2].stat.exists %}
        npm
      {% else %}
        pnpm
      {% endif %}
  tags:
    - tools
    - free-cluely

- name: Install free-cluely dependencies
  ansible.builtin.command: "{{ package_manager }} install"
  args:
    chdir: "{{ free_cluely_install_dir | default('~/.local/share/free-cluely') }}"
  environment:
    PNPM_HOME: "{{ ansible_user_dir }}/.local/share/pnpm"
    PATH: "{{ ansible_user_dir }}/.local/share/pnpm:{{ ansible_env.PATH }}"
  become: false
  tags:
    - tools
    - free-cluely
    - deps

- name: Create free-cluely .env file
  ansible.builtin.template:
    src: free-cluely.env.j2
    dest: "{{ free_cluely_install_dir | default('~/.local/share/free-cluely') }}/.env"
    mode: '0600'
  when: free_cluely_gemini_api_key is defined
  tags:
    - tools
    - free-cluely
    - config

- name: Create free-cluely desktop entry (Linux)
  ansible.builtin.template:
    src: free-cluely.desktop.j2
    dest: /usr/share/applications/free-cluely.desktop
    mode: '0644'
  when: ansible_os_family == 'Debian' and '"graphical" in ansible_run_tags'
  become: true
  tags:
    - tools
    - free-cluely
    - desktop

- name: Create free-cluely start script
  ansible.builtin.template:
    src: free-cluely-start.sh.j2
    dest: "{{ free_cluely_install_dir | default('~/.local/share/free-cluely') }}/start-free-cluely.sh"
    mode: '0755'
  tags:
    - tools
    - free-cluely

- name: Build free-cluely for production
  ansible.builtin.command: "{{ package_manager }} run build"
  args:
    chdir: "{{ free_cluely_install_dir | default('~/.local/share/free-cluely') }}"
  environment:
    PNPM_HOME: "{{ ansible_user_dir }}/.local/share/pnpm"
    PATH: "{{ ansible_user_dir }}/.local/share/pnpm:{{ ansible_env.PATH }}"
  become: false
  when: free_cluely_build | default(true) | bool
  tags:
    - tools
    - free-cluely
    - build

---
# tasks file for levonk.vibeops.tools - git-friendly

- name: Install git-friendly via levonk.common.package
  levonk.common.package:
    name: git-friendly
    state: latest
  register: git_friendly_pkg_result
  failed_when: false
  tags:
    - vibeops
    - tools
    - git
    - git-friendly

- name: Fallback: Install git-friendly via script if package fails
  block:
    - name: Install git-friendly using vet_script_installer
      levonk.common.vet_script_installer:
        script_url: https://raw.githubusercontent.com/git-friendly/git-friendly/main/install.sh
        script_checksum: "{{ lookup('url', 'https://raw.githubusercontent.com/git-friendly/git-friendly/main/install.sh.sha256') }}"
        creates: /usr/local/bin/git-friendly
      become: true
  when: git_friendly_pkg_result is failed
  tags:
    - vibeops
    - tools
    - git
    - git-friendly
    - fallback

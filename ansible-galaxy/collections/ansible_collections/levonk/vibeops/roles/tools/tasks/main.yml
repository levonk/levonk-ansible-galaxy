---
# tasks file for levonk.vibeops.tools

# OS-specific tools (macOS, Windows, clipboard managers)
- name: Install OS-specific tools
  ansible.builtin.include_tasks: os_specific/main.yml

# Text and code editors (Sublime Text)
- name: Install text and code editors
  ansible.builtin.include_tasks: editors/main.yml

# Shell and terminal tools (Atuin, git-friendly, tealdeer, halp, eza, terminals)
- name: Install shell and terminal tools
  ansible.builtin.include_tasks: shell_terminal/main.yml

# AI and productivity tools (Claude Task Master, Free Cluely, m1f, Espanso)
- name: Install AI and productivity tools
  ansible.builtin.include_tasks: ai_productivity/main.yml

# UI tools and application launchers (Raycast, Speech)
- name: Install UI tools and application launchers
  ansible.builtin.include_tasks: ui_tools/main.yml

# Diagram and visualization tools (Graphviz, MermaidJS, Archi)
- name: Install diagram and visualization tools
  ansible.builtin.include_tasks: diagram_viz/main.yml

# System and file utilities (7-Zip, SSH)
- name: Install system and file utilities
  ansible.builtin.include_tasks: system_utils/main.yml

# Virtualization and development tools (Vagrant, VirtualBox)
- name: Install virtualization and development tools
  ansible.builtin.include_tasks: virtualization/main.yml

# Utility tools (copier, etc.)
- name: Install utility tools
  ansible.builtin.include_tasks: utils/main.yml

---
# tasks file for levonk.vibeops.tools - Sublime Text

- name: Install Sublime Text via levonk.common.package (cross-platform)
  levonk.common.package:
    name:
      - sublime-text
    state: latest
  tags:
    - vibeops
    - tools
    - sublime-text

- name: Debian: Install Sublime Text
  include_role:
    name: levonk.common.package
  vars:
    name: sublime-text
    state: latest
    apt_keys:
      - url: https://download.sublimetext.com/sublimehq-pub.gpg
        id: sublimehq-pub.gpg
    apt_repositories:
      - repo: "deb https://download.sublimetext.com/ apt/stable/"
        filename: sublime-text
  when: ansible_os_family == 'Debian'
  tags:
    - vibeops
    - tools
    - sublime-text

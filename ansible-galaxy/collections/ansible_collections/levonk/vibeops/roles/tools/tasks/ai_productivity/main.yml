---
# AI and productivity tools main task file

- name: Install claude-task-master
  ansible.builtin.include_tasks: claude_task_master.yml
  when: tools_install_claude_task_master | default(true)
  tags: ['ai', 'graphical']

- name: Install Free Cluely
  ansible.builtin.include_tasks: free_cluely.yml
  when: tools_install_free_cluely | default(true)
  tags: ['ai', 'graphical']

- name: Install m1f tool
  ansible.builtin.include_tasks: m1f.yml
  when: tools_install_m1f | default(false)
  tags: ['ai', 'graphical']

- name: Install Ollama AI platform
  ansible.builtin.include_tasks: ollama-desktop.yml
  when: tools_install_ollama_desktop | default(true)
  tags: ['ollama', 'ai', 'graphical']

- name: Install Wispr Flow
  ansible.builtin.include_tasks: wispr_flow.yml
  when: tools_install_wispr_flow | default(true)
  tags: ['ai', 'graphical']

- name: Install LLM CLI
  ansible.builtin.include_tasks: llm.yml
  when: tools_install_llm | default(true)
  tags: ['ai', 'llm']

- name: Install ORT CLI
  ansible.builtin.include_tasks: ort.yml
  when: tools_install_ort | default(true)
  tags: ['ai', 'ort']

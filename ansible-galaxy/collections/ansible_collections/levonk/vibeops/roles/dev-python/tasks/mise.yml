---
# Use Mise to install Python runtime and tools

- name: Ensure Mise is installed
  ansible.builtin.include_role:
    name: levonk.common.mise

# Non-Windows: Linux/macOS
- name: Install Python via Mise (non-Windows)
  ansible.builtin.shell: |
    set -euo pipefail
    mise use -g python@{{ dev_python_version }}
  args:
    executable: /bin/bash
  when: ansible_facts['os_family'] in ['Debian', 'RedHat', 'Ubuntu', 'MacOSX']

- name: Install Poetry via Mise (non-Windows)
  ansible.builtin.shell: |
    set -euo pipefail
    mise use -g poetry@{{ dev_poetry_version }}
  args:
    executable: /bin/bash
  when: ansible_facts['os_family'] in ['Debian', 'RedHat', 'Ubuntu', 'MacOSX']

# Windows
- name: Install Python via Mise (Windows)
  ansible.builtin.command: mise use -g python@{{ dev_python_version }}
  when: ansible_facts['os_family'] == 'Windows'

- name: Install Poetry via Mise (Windows)
  ansible.builtin.command: mise use -g poetry@{{ dev_poetry_version }}
  when: ansible_facts['os_family'] == 'Windows'
